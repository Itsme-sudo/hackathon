version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vidyutfleet_db
    environment:
      POSTGRES_USER: vidyut_user
      POSTGRES_PASSWORD: vidyut_password_2026
      POSTGRES_DB: vidyutfleet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vidyutfleet_api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://vidyut_user:vidyut_password_2026@postgres:5432/vidyutfleet_db?schema=public
      JWT_SECRET: vidyutfleet_jwt_secret_hackathon_2026
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
